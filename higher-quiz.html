<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Career Planner - Class 11–12 Quiz</title>

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet"
          href="css/higher-quiz.css">

</head>


<body>


<header>

    <nav>

        <div class="logo">
            Career Planner
        </div>

        <ul class="nav-links">

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="#">
                    Explore Careers
                </a>
            </li>

            <li>
                <a href="#">
                    About
                </a>
            </li>

        </ul>

    </nav>

</header>


<main class="higher-quiz-page">


    <div class="higher-quiz-container">


        <!-- TOP -->

        <div class="quiz-top">

            <div>

                <span class="quiz-label">
                    CLASS 11–12
                </span>

                <span id="questionNumber">
                    Question 1 of 5
                </span>

            </div>

            <span id="progressPercentage">
                20%
            </span>

        </div>


        <!-- PROGRESS -->

        <div class="progress-bar">

            <div
                id="progressFill"
                class="progress-fill">
            </div>

        </div>


        <!-- QUESTION CARD -->

        <section class="higher-question-card">


            <div class="question-icon">
                🎯
            </div>


            <h1 id="questionText">
                Loading question...
            </h1>


            <p class="question-help">
                Choose the option or options that
                best describe your interests.
            </p>


            <!-- OPTIONS -->

            <div
                id="answerContainer"
                class="answer-container">
            </div>


            <!-- NEXT -->

            <button
                id="nextButton"
                class="next-button"
                disabled>

                Next

                <span>→</span>

            </button>


        </section>


        <p class="quiz-footer">
            There are no right or wrong answers.
            Choose what feels most natural to you.
        </p>


    </div>

</main>


<script src="js/higher-questions.js"></script>

<script src="js/higher-quiz.js"></script>


</body>

</html>
