<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Career Planner - Class 9-10 Quiz</title>

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet"
          href="css/quiz.css">

</head>


<body>

    <!-- NAVIGATION -->

    <header>

        <nav>

            <div class="logo">
                Career Planner
            </div>

            <ul class="nav-links">

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="#">Explore Careers</a>
                </li>

                <li>
                    <a href="#">About</a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- QUIZ -->

    <main class="quiz-page">

        <div class="quiz-container">


            <!-- TOP -->

            <div class="quiz-top">

                <span id="questionNumber">
                    Question 1 of 5
                </span>

                <span id="progressPercentage">
                    20%
                </span>

            </div>


            <!-- PROGRESS -->

            <div class="progress-bar">

                <div id="progressFill"
                     class="progress-fill">
                </div>

            </div>


            <!-- QUESTION -->

            <div class="question-card">

                <h1 id="questionText">
                    Loading question...
                </h1>

                <p class="question-help">
                    Select the option that feels most like you.
                </p>


                <!-- ANSWERS -->

                <div id="answerContainer"
                     class="answer-container">
                </div>


                <!-- NEXT -->

                <button id="nextButton"
                        class="next-button"
                        disabled>

                    Next

                </button>

            </div>

        </div>

    </main>


    <!-- JAVASCRIPT -->

    <script src="js/school-questions.js"></script>

    <script src="js/school-quiz.js"></script>

</body>

</html>
